[package]
name = "sloperberpunk-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Authoritative, sharded Sloperberpunk world and plaintext character service"
publish = false

[dependencies]
argon2 = "=0.5.3"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
getrandom = "=0.3.4"
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
